[package]
name = "prism_world_canvas"
version = "0.1.0"
edition = "2024"
description = "The canvas World: the one foreign World chess runs under, answering Gui.Window, Gui.Scene, Gui.Metrics and Gui.Focus with winit, softbuffer, tiny-skia and fontdue"
license-file = "../../LICENSE.md"

[dependencies]
prism_rt = { path = "../../prism_rt" }
fontdue = "0.9"
# `png-format` brings the png crate, which decodes `Draw.Image` files.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

# macOS needs no backend feature; Linux builds with X11 only, which is enough to compile and
# check the crate here.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
